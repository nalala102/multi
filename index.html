<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등학교 학급 도우미 대시보드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Jua', sans-serif; }
        .jua-font { font-family: 'Jua', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full py-6 px-6 bg-white/80 backdrop-blur-md shadow-sm border-b border-indigo-100 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl jua-font text-indigo-900">우리반 스마트 교실</h1>
                    <p class="text-xs text-slate-500 font-medium">다중 페이지로 구성된 학급 도우미 프로그램</p>
                </div>
            </div>
            <div class="text-xs bg-indigo-100 text-indigo-800 font-bold px-3 py-1.5 rounded-full">
                Multi-Page Web App
            </div>
        </div>
    </header>

    <!-- Main Content: Dashboard Grid -->
    <main class="max-w-5xl mx-auto px-6 py-12 flex-1 flex flex-col justify-center w-full">
        <div class="text-center mb-10">
            <h2 class="text-3xl sm:text-4xl jua-font text-indigo-900 mb-3">어떤 활동을 진행할까요?</h2>
            <p class="text-slate-600 font-medium text-sm sm:text-base">원하시는 도구 카드를 눌러 페이지를 이동하세요.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl mx-auto w-full">
            <!-- Card 1: Student Picker -->
            <a href="picker.html" class="group bg-white rounded-3xl p-8 shadow-xl border border-indigo-100 hover:border-indigo-400 hover:shadow-2xl transition-all duration-300 flex flex-col items-center text-center transform hover:-translate-y-1">
                <div class="w-16 h-16 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl flex items-center justify-center text-white mb-6 shadow-lg group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                </div>
                <h3 class="text-xl jua-font text-indigo-900 mb-2">학생 제비뽑기</h3>
                <p class="text-xs text-slate-500 leading-relaxed mb-6">22명의 학생 중 랜덤으로 한 명을 뽑는 룰렛 추첨 페이지</p>
                <span class="inline-flex items-center space-x-1 px-4 py-2 bg-indigo-50 group-hover:bg-indigo-600 group-hover:text-white text-indigo-600 font-semibold rounded-xl text-sm transition-colors">
                    <span>페이지 이동</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </span>
            </a>

            <!-- Card 2: Seat Arranger -->
            <a href="seat.html" class="group bg-white rounded-3xl p-8 shadow-xl border border-purple-100 hover:border-purple-400 hover:shadow-2xl transition-all duration-300 flex flex-col items-center text-center transform hover:-translate-y-1">
                <div class="w-16 h-16 bg-gradient-to-tr from-purple-500 to-pink-500 rounded-2xl flex items-center justify-center text-white mb-6 shadow-lg group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                    </svg>
                </div>
                <h3 class="text-xl jua-font text-purple-900 mb-2">자리 배치 도우미</h3>
                <p class="text-xs text-slate-500 leading-relaxed mb-6">학생들의 자리를 무작위로 섞어서 배치해주는 페이지</p>
                <span class="inline-flex items-center space-x-1 px-4 py-2 bg-purple-50 group-hover:bg-purple-600 group-hover:text-white text-purple-600 font-semibold rounded-xl text-sm transition-colors">
                    <span>페이지 이동</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </span>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-slate-400 border-t border-slate-100 bg-white/50">
        <p>우리반 스마트 교실 대시보드 • Multi-Page HTML Template</p>
    </footer>

</body>
</html>
