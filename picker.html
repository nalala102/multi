<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 제비뽑기 - 우리반 스마트 교실</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Inter', 'Jua', sans-serif; }
        .jua-font { font-family: 'Jua', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header with Back Button -->
    <header class="w-full py-6 px-6 bg-white/80 backdrop-blur-md shadow-sm border-b border-indigo-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl transition flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </a>
                <div>
                    <h1 class="text-xl jua-font text-indigo-900">학생 제비뽑기</h1>
                    <p class="text-xs text-slate-500 font-medium">랜덤 룰렛 추첨</p>
                </div>
            </div>
            <button onclick="openSettings()" class="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-sm transition border border-indigo-200 shadow-sm">
                명단 편집
            </button>
        </div>
    </header>

    <!-- Main Picker Container -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 flex flex-col items-center justify-center w-full">
        <div class="w-full max-w-xl bg-white/95 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-indigo-100 flex flex-col items-center relative overflow-hidden">
            <div class="text-center mb-6 z-10">
                <span class="inline-block px-3.5 py-1 bg-indigo-100 text-indigo-800 rounded-full text-xs font-bold uppercase mb-2">Lucky Draw</span>
                <h2 id="status-title" class="text-slate-600 font-medium text-sm sm:text-base">버튼을 눌러 행운의 주인공을 뽑으세요!</h2>
            </div>

            <!-- Name Display Slot -->
            <div class="w-full py-12 px-6 bg-gradient-to-r from-slate-50 via-indigo-50/50 to-slate-50 rounded-2xl border-2 border-dashed border-indigo-200 flex items-center justify-center mb-8 shadow-inner z-10 transition-all">
                <span id="display-name" class="text-4xl sm:text-6xl jua-font text-indigo-600 tracking-wider">대기 중...</span>
            </div>

            <!-- Pick Button -->
            <button id="pick-button" onclick="startPicking()" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold text-lg rounded-2xl shadow-lg transition active:scale-95 flex items-center justify-center space-x-2 z-10">
                <span class="jua-font tracking-wide">제비뽑기 시작!</span>
            </button>

            <div class="mt-6 text-xs text-slate-400 z-10">
                <span>등록된 학생 수: <strong id="student-count" class="text-indigo-600 font-bold">22</strong>명</span>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl jua-font text-indigo-900">학생 명단 관리</h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-600 p-2 rounded-xl hover:bg-slate-100 transition">✕</button>
            </div>
            <textarea id="students-textarea" class="w-full h-64 p-4 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none mb-4 font-medium text-slate-700 bg-slate-50"></textarea>
            <div class="flex space-x-3">
                <button onclick="resetToDefault()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm">기본 복원</button>
                <button onclick="saveStudents()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md">저장하기</button>
            </div>
        </div>
    </div>

    <footer class="w-full py-4 text-center text-xs text-slate-400 border-t border-slate-100 bg-white/50">
        <p>학생 제비뽑기 페이지 • Multi-Page App</p>
    </footer>

    <script>
        const defaultStudents = [
            "김민준", "이지은", "박도윤", "서서윤", "정시우",
            "아이유", "한지민", "송중기", "김태리", "남주혁",
            "손흥민", "김연아", "유재석", "제니", "정국",
            "카리나", "윈터", "장원영", "안유진", "차은우",
            "페이커", "박보검"
        ];

        let students = [...defaultStudents];
        let isPicking = false;

        function loadSettings() {
            const saved = localStorage.getItem('picker_students_multi');
            if (saved) {
                try { students = JSON.parse(saved); } catch(e) { students = [...defaultStudents]; }
            }
            document.getElementById('student-count').textContent = students.length;
        }

        function openSettings() {
            document.getElementById('students-textarea').value = students.join('\n');
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function resetToDefault() {
            students = [...defaultStudents];
            document.getElementById('students-textarea').value = students.join('\n');
        }

        function saveStudents() {
            const text = document.getElementById('students-textarea').value;
            const lines = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            if (lines.length === 0) { alert('최소 한 명 이상 입력해주세요.'); return; }
            students = lines;
            localStorage.setItem('picker_students_multi', JSON.stringify(students));
            document.getElementById('student-count').textContent = students.length;
            closeSettings();
        }

        function startPicking() {
            if (isPicking || students.length === 0) return;
            isPicking = true;
            const pickBtn = document.getElementById('pick-button');
            const displayName = document.getElementById('display-name');
            const statusTitle = document.getElementById('status-title');
            pickBtn.disabled = true;
            pickBtn.classList.add('opacity-50');
            statusTitle.textContent = '두근두근 추첨 중입니다... 🎲';

            let counter = 0;
            let interval = 50;

            function run() {
                const rand = Math.floor(Math.random() * students.length);
                displayName.textContent = students[rand];
                counter++;
                if (counter < 20) {
                    interval += 15;
                    setTimeout(run, interval);
                } else {
                    const finalIndex = Math.floor(Math.random() * students.length);
                    displayName.textContent = students[finalIndex];
                    statusTitle.textContent = '🎉 당첨을 축하합니다! 🎉';
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    isPicking = false;
                    pickBtn.disabled = false;
                    pickBtn.classList.remove('opacity-50');
                }
            }
            run();
        }

        window.onload = loadSettings;
    </script>
</body>
</html>
